name: fix-multikey-tab-restore

on:
  push:
    branches:
      - experimental/multi-key-timeline-v1
    paths:
      - .github/workflows/fix-multikey-tab-restore.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental/multi-key-timeline-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply lifecycle fix
        run: python .github/fix_multikey_tab_restore.py
      - name: Validate lifecycle fix
        env:
          PYTHONPATH: tests
        run: |
          node --check web/zzzzz_h3sc_timeline_experimental.js
          node --check web/zzzzzzz_h3sc_multikey_timeline.js
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/verify_manifest.py
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-multikey-tab-restore.yml .github/fix_multikey_tab_restore.py
          git add web/zzzzz_h3sc_timeline_experimental.js web/zzzzzzz_h3sc_multikey_timeline.js tests/test_multikey_timeline.py PACKAGE_MANIFEST.sha256
          git commit -m "fix(experimental): preserve multikey state across tab lifecycle"
          git push origin HEAD:experimental/multi-key-timeline-v1

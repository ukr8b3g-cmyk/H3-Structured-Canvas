name: validate

on:
  push:
    branches: [main, experimental/3-slot-timeline-v1]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        shell: bash
        run: python -m compileall -q .
      - name: Python tests
        shell: bash
        env:
          PYTHONPATH: tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        shell: bash
        run: |
          node --check web/h3_structured_canvas.js
          node --check web/zz_h3sc_output_migration.js
          node --check web/zzz_h3sc_easyuse_compat.js
          node --check web/zzzz_h3sc_correctness_cleanup.js
          node --check web/zzzzz_h3sc_timeline_experimental.js
          node --check web/zzzzzz_h3sc_timeline_fix.js
          node --check web/zzzzzzz_h3sc_experimental_persistence.js
          node --check web/zzzzzzzz_h3sc_prompt_tab_persistence.js
          node --check web/zzzzzzzzz_h3sc_experimental_v2.js
          node --check web/zzzzzzzzzz_h3sc_overscan_delete_fix.js
          node --check web/zzzzzzzzzzz_h3sc_ui_polish.js
      - name: Manifest hashes
        shell: bash
        run: |
          sha256sum .github/workflows/validate.yml
          sha256sum tests/test_experimental_v2.py
          sha256sum web/zzzzzzzzzzz_h3sc_ui_polish.js
      - name: Package manifest
        shell: bash
        run: python tools/verify_manifest.py

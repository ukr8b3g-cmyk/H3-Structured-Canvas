name: apply-key-marker-polish

on:
  push:
    branches: [experimental/multi-key-timeline-v1]
    paths: [.github/workflows/apply-key-marker-polish.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental/multi-key-timeline-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply key marker polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          js_path = Path('web/zzzzzzz_h3sc_multikey_timeline.js')
          s = js_path.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              s = s.replace(old, new, 1)

          once(
              'const SLOT_LABELS = { a: "A", b: "B", c: "C" };\n',
              'const SLOT_LABELS = { a: "A", b: "B", c: "C" };\nconst SLOT_COLORS = { a: "#ef4444", b: "#3b82f6", c: "#facc15" };\n',
              'slot colors',
          )

          anchor = '''function setPlayheadSeconds(controller, seconds) {
            const exp = controller.__h3scTimelineExp;
            if (!exp) return;
            setPlayhead(controller, clamp(Number(seconds) || 0, 0, exp.duration) / Math.max(exp.duration, 1e-9));
          }
          '''
          insert = anchor + '''
          function selectKey(controller, slot, time) {
            const exp = controller.__h3scTimelineExp;
            if (!exp?.tracks?.[slot]) return;
            stopPlayback(controller);
            controller.state.canvas.active_slot = slot;
            exp.t = clamp(Number(time) || 0, 0, 1);
            exp.selectedSlot = slot;
            controller.updateControls?.();
            refreshAll(controller, true);
            controller.canvas?.focus?.();
          }
          '''
          once(anchor, insert, 'selectKey helper')

          once('  setPlayhead(controller, target);\n}', '  selectKey(controller, controller.activeSlot, target);\n}', 'key navigation selection')

          old_css = '''.h3sc-mk-range-wrap{position:relative;flex:1;min-width:150px}
          .h3sc-mk-range{width:100%;accent-color:#48d5cf}
          .h3sc-mk-layer{position:absolute;left:8px;right:8px;top:50%;height:0;pointer-events:none}
          .h3sc-mk-marker{position:absolute;transform:translate(-50%,-50%) rotate(45deg);width:10px;height:10px;padding:0;border:1px solid #111;background:#48d5cf;pointer-events:auto;cursor:ew-resize}
          .h3sc-mk-marker.end{width:8px;height:8px;background:#ddd;cursor:pointer}
          .h3sc-mk-marker.active{outline:2px solid white;outline-offset:2px}
          '''
          new_css = '''.h3sc-mk-range-wrap{position:relative;flex:1;min-width:180px;height:54px;overflow:visible}
          .h3sc-mk-range{position:absolute;left:0;right:0;top:0;width:100%;z-index:1;accent-color:#a7afb1}
          .h3sc-mk-layer{position:absolute;left:9px;right:9px;top:25px;height:28px;pointer-events:none;z-index:4;overflow:visible}
          .h3sc-mk-marker{position:absolute;top:0;transform:translate(-50%,-50%);min-width:22px;height:16px;padding:0 3px;border:1px solid rgba(0,0,0,.9);border-radius:4px;background:#777;color:#fff;font:800 9px/14px ui-monospace,Consolas,monospace;text-align:center;pointer-events:auto;cursor:ew-resize;z-index:6;box-shadow:0 1px 3px rgba(0,0,0,.75);user-select:none}
          .h3sc-mk-marker:hover{filter:brightness(1.15);z-index:8}
          .h3sc-mk-marker.active{outline:2px solid #fff;outline-offset:2px;z-index:9}
          .h3sc-mk-marker.endpoint{min-width:16px;width:16px;height:16px;padding:0;border-radius:50%;background:#d8dddd;color:#151515;cursor:pointer;font-size:8px}
          .h3sc-mk-marker.slot-c{color:#151515}
          '''
          once(old_css, new_css, 'marker css')

          start = s.index('function renderMarkers(controller) {')
          end = s.index('function startMarkerDrag(controller, slot, index, event) {', start)
          new_render = '''function syncMarkerSelection(controller) {
            const exp = controller.__h3scTimelineExp;
            const ui = controller.__h3scMultiUI;
            if (!exp || !ui?.layer) return;
            const activeSlot = controller.activeSlot;
            for (const marker of ui.layer.querySelectorAll(".h3sc-mk-marker.key")) {
              const time = Number(marker.dataset.time);
              const selected = marker.dataset.slot === activeSlot && Number.isFinite(time) && Math.abs(time - exp.t) <= EPS;
              marker.classList.toggle("active", selected);
            }
          }

          function renderMarkers(controller) {
            const exp = controller.__h3scTimelineExp;
            const ui = controller.__h3scMultiUI;
            if (!ui?.layer || !exp) return;
            ui.layer.replaceChildren();

            const rowTop = { a: 0, b: 10, c: 20 };
            for (const slot of VISIBLE_SLOTS) {
              const track = exp.tracks?.[slot];
              const keys = (track?.keys ?? []).slice().sort((a, b) => a.time - b.time);
              keys.forEach((key, index) => {
                const marker = document.createElement("button");
                marker.className = `h3sc-mk-marker key slot-${slot}`;
                marker.dataset.slot = slot;
                marker.dataset.index = String(index);
                marker.dataset.time = String(key.time);
                marker.style.left = `${key.time * 100}%`;
                marker.style.top = `${rowTop[slot]}px`;
                marker.style.background = SLOT_COLORS[slot];
                marker.textContent = `${SLOT_LABELS[slot]}${index + 1}`;
                marker.setAttribute("aria-label", `${SLOT_LABELS[slot]} key ${index + 1}`);
                marker.title = `${SLOT_LABELS[slot]} Key ${index + 1} · ${(key.time * exp.duration).toFixed(2)}s`;
                marker.onpointerdown = (event) => startMarkerDrag(controller, slot, index, event);
                ui.layer.append(marker);
              });
            }

            const activeTrack = exp.tracks?.[controller.activeSlot];
            if (activeTrack && !trackEmpty(activeTrack)) {
              for (const [label, time] of [["S", 0], ["E", 1]]) {
                const marker = document.createElement("button");
                marker.className = "h3sc-mk-marker endpoint";
                marker.style.left = `${time * 100}%`;
                marker.style.top = "20px";
                marker.textContent = label;
                marker.setAttribute("aria-label", label === "S" ? "Start" : "End");
                marker.title = label === "S" ? "START 0.00s" : `END ${exp.duration.toFixed(2)}s`;
                marker.onclick = (event) => {
                  event.preventDefault();
                  event.stopPropagation();
                  setPlayhead(controller, time);
                };
                ui.layer.append(marker);
              }
            }

            syncMarkerSelection(controller);
          }

          '''
          s = s[:start] + new_render + s[end:]

          start = s.index('function startMarkerDrag(controller, slot, index, event) {')
          end = s.index('function updateUI(controller, markers = true) {', start)
          new_drag = '''function startMarkerDrag(controller, slot, index, event) {
            if (event.button !== 0) return;
            event.preventDefault();
            event.stopPropagation();

            const exp = controller.__h3scTimelineExp;
            const ui = controller.__h3scMultiUI;
            const ref = exp?.tracks?.[slot]?.keys?.[index];
            const marker = event.currentTarget;
            if (!ref || !ui?.layer) return;

            controller.state.canvas.active_slot = slot;
            exp.selectedSlot = slot;
            controller.updateControls?.();
            const rect = ui.layer.getBoundingClientRect();
            const pointerId = event.pointerId;
            const startX = event.clientX;
            let raf = 0;
            let pendingX = startX;
            let moved = false;

            const apply = () => {
              raf = 0;
              const live = exp.tracks[slot];
              if (!live?.keys?.includes(ref)) return;
              const gap = MIN_KEY_GAP_SECONDS / exp.duration;
              const ordered = live.keys.slice().sort((a, b) => a.time - b.time);
              const pos = ordered.indexOf(ref);
              const lo = pos > 0 ? ordered[pos - 1].time + gap : gap;
              const hi = pos < ordered.length - 1 ? ordered[pos + 1].time - gap : 1 - gap;
              ref.time = clamp((pendingX - rect.left) / Math.max(rect.width, 1), lo, hi);
              live.keys.sort((a, b) => a.time - b.time);
              syncLegacyMid(live);
              exp.t = ref.time;
              exp.selectedSlot = slot;
              if (marker?.style) {
                marker.style.left = `${ref.time * 100}%`;
                marker.dataset.time = String(ref.time);
              }
              drawPreview(controller);
              updateUI(controller, false);
            };

            const move = (moveEvent) => {
              if (moveEvent.pointerId !== pointerId) return;
              pendingX = moveEvent.clientX;
              if (Math.abs(pendingX - startX) >= 2) moved = true;
              if (moved && !raf) raf = requestAnimationFrame(apply);
            };

            const cleanup = () => {
              window.removeEventListener("pointermove", move, true);
              window.removeEventListener("pointerup", up, true);
              window.removeEventListener("pointercancel", cancel, true);
            };

            const up = (upEvent) => {
              if (upEvent.pointerId !== pointerId) return;
              cleanup();
              if (raf) cancelAnimationFrame(raf);
              if (moved) {
                apply();
                saveState(controller);
              } else {
                selectKey(controller, slot, ref.time);
              }
            };

            const cancel = (cancelEvent) => {
              if (cancelEvent.pointerId !== pointerId) return;
              cleanup();
              if (raf) cancelAnimationFrame(raf);
              selectKey(controller, slot, ref.time);
            };

            window.addEventListener("pointermove", move, true);
            window.addEventListener("pointerup", up, true);
            window.addEventListener("pointercancel", cancel, true);
          }

          '''
          s = s[:start] + new_drag + s[end:]

          once(
              '  ui.count.textContent = `${SLOT_LABELS[slot] ?? "?"}: ${count}/${MAX_INTERMEDIATE_KEYS} keys`;\n',
              '  ui.count.textContent = VISIBLE_SLOTS\n    .map((item) => `${SLOT_LABELS[item]}:${exp.tracks?.[item]?.keys?.length ?? 0}`)\n    .join(" · ");\n',
              'all-slot key count',
          )
          once(
              '    ui.state.textContent = `KEY ${point.index + 1} · EDIT`;\n    ui.note.textContent = `Intermediate key at ${seconds.toFixed(2)}s is editable.`;\n',
              '    ui.state.textContent = `${SLOT_LABELS[slot]} KEY ${point.index + 1} · EDIT`;\n    ui.note.textContent = `${SLOT_LABELS[slot]}${point.index + 1} at ${seconds.toFixed(2)}s is editable. Drag its colored marker to retime.`;\n',
              'selected key label',
          )
          once(
              '  if (markers) renderMarkers(controller);\n}',
              '  if (markers) renderMarkers(controller);\n  else syncMarkerSelection(controller);\n}',
              'selection sync',
          )

          js_path.write_text(s, encoding='utf-8', newline='\n')

          test_path = Path('tests/test_multikey_timeline.py')
          t = test_path.read_text(encoding='utf-8')
          t = t.replace('self.assertIn("setPlayhead(controller, ref.time)", source)', 'self.assertIn("selectKey(controller, slot, ref.time)", source)')
          t = t.replace('self.assertIn("const rect = (ui.layer ?? ui.wrap).getBoundingClientRect()", source)', 'self.assertIn("const rect = ui.layer.getBoundingClientRect()", source)')
          marker_test = '''
            def test_key_markers_are_slot_colored_persistent_and_selectable(self):
                source = MULTIKEY_JS.read_text(encoding="utf-8")
                for required in (
                    'const SLOT_COLORS = { a: "#ef4444", b: "#3b82f6", c: "#facc15" }',
                    'for (const slot of VISIBLE_SLOTS)',
                    'marker.style.background = SLOT_COLORS[slot]',
                    'marker.textContent = `${SLOT_LABELS[slot]}${index + 1}`',
                    'ui.layer.querySelectorAll(".h3sc-mk-marker.key")',
                    'selectKey(controller, slot, ref.time)',
                    'accent-color:#a7afb1',
                    'ui.state.textContent = `${SLOT_LABELS[slot]} KEY ${point.index + 1} · EDIT`',
                ):
                    self.assertIn(required, source)
                self.assertIn('c: "#facc15"', source)
                self.assertIn('marker.className = `h3sc-mk-marker key slot-${slot}`', source)
          '''
          marker_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker_test.splitlines())
          needle = '\n\nif __name__ == "__main__":\n'
          if 'test_key_markers_are_slot_colored_persistent_and_selectable' not in t:
              if needle not in t:
                  raise SystemExit('test insertion anchor missing')
              t = t.replace(needle, '\n' + marker_test + needle, 1)
          test_path.write_text(t, encoding='utf-8', newline='\n')

          manifest = Path('PACKAGE_MANIFEST.sha256')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          targets = {
              'web/zzzzzzz_h3sc_multikey_timeline.js',
              'tests/test_multikey_timeline.py',
          }
          out = []
          for line in lines:
              digest, relative = line.split('  ', 1)
              if relative in targets:
                  data = Path(relative).read_bytes().replace(b'\r\n', b'\n')
                  digest = hashlib.sha256(data).hexdigest()
              out.append(f'{digest}  {relative}')
          manifest.write_text('\n'.join(out) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Validate patched tree
        shell: bash
        env:
          PYTHONPATH: tests
        run: |
          node --check web/zzzzzzz_h3sc_multikey_timeline.js
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/verify_manifest.py
      - name: Commit polished markers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/zzzzzzz_h3sc_multikey_timeline.js tests/test_multikey_timeline.py PACKAGE_MANIFEST.sha256
          git commit -m "feat(experimental): polish multikey marker visibility and selection"
          git push origin HEAD:experimental/multi-key-timeline-v1
